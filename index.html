<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="Українці в Швейцарії × VIDNOVA — інформація, події, інтеграція та консультації.">
  <title>Українці в Швейцарії × VIDNOVA</title>
  <style>
    :root{--bg:#f7f5ef;--surface:#fff;--ink:#192b2a;--sub:#63726e;--red:#bb3035;--line:#e5e6dc;--gold:#caa66c;--shadow:0 12px 32px rgba(21,40,37,.065)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;line-height:1.48}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:560px;padding:24px 18px 110px;margin:0 auto}.eyebrow{font-size:10px;letter-spacing:.21em;font-weight:850;text-transform:uppercase;color:var(--red)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.06em}.flag{width:31px;height:31px;border:1px solid #ddd;border-radius:10px;background:#d52f3b;color:white;display:grid;place-items:center;font-size:19px}.lang{display:flex;background:white;border:1px solid var(--line);border-radius:20px;padding:3px;gap:2px}.lang button{border:0;background:transparent;border-radius:17px;padding:5px 8px;color:var(--sub);font-size:11px;font-weight:750}.lang button.active{background:#203936;color:white}h1{font-size:clamp(34px,9vw,49px);letter-spacing:-.055em;line-height:1.06;margin:10px 0 15px;font-weight:800}h1 em{font-style:normal;color:var(--red)}.lede{font-size:15px;color:var(--sub);margin:0 0 21px;max-width:410px}.hero{border:1px solid #e5e1d7;border-radius:27px;padding:26px 22px 22px;background:linear-gradient(139deg,#fff 5%,#f3eee3 95%);box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'+';position:absolute;top:16px;right:20px;font-size:65px;font-weight:800;color:rgba(187,48,53,.09);line-height:1}.cta{display:flex;justify-content:center;align-items:center;gap:9px;border-radius:13px;background:var(--red);color:white;font-weight:800;padding:14px 17px;border:0;font-size:14px;min-height:47px}.hero .cta{width:100%}.softnote{font-size:11px;color:var(--sub);margin:12px 2px 0}.sectionhead{margin:29px 2px 12px;display:flex;align-items:end;justify-content:space-between}.sectionhead h2{font-size:21px;letter-spacing:-.035em;margin:0}.sectionhead span{font-size:11px;color:var(--sub)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:16px 14px;background:white;border:1px solid var(--line);border-radius:17px;min-height:135px;display:flex;flex-direction:column;box-shadow:0 3px 10px #15292406;transition:transform .15s}.tile:active,.entry:active{transform:scale(.985)}.tile .pict{font-size:23px;line-height:1.3}.tile strong{font-size:14px;margin-top:14px}.tile small{font-size:11px;color:var(--sub);margin-top:2px}.tile .arr{margin-left:auto;margin-top:auto;color:var(--red);font-weight:900}.card{border:1px solid var(--line);border-radius:18px;background:white;padding:18px;margin-top:10px}.card h3{font-size:17px;margin:0 0 7px}.card p{margin:0 0 15px;color:var(--sub);font-size:13px}.rowlinks{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;padding:9px 11px;border:1px solid #ddded4;border-radius:11px;font-size:12px;font-weight:750;background:#fff}.pill.primary{background:#203936;color:#fff;border-color:#203936}.entry{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 16px;margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:13px}.entry strong{font-size:13px}.entry small{display:block;color:var(--sub);font-size:11px;margin-top:2px}.entry>span{color:var(--red);font-size:22px}.disclaimer{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin-top:20px;font-size:11px;color:var(--sub)}.footer{margin-top:30px;padding:20px 3px;color:var(--sub);font-size:11px;border-top:1px solid var(--line)}.footer strong{color:var(--ink)}.hide{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(247,245,239,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));z-index:9}.bottomInner{max-width:520px;margin:auto;display:flex;justify-content:space-around;gap:4px}.navbtn{background:transparent;border:0;color:var(--sub);font-size:11px;font-weight:700;padding:4px 8px;display:flex;gap:2px;align-items:center;flex-direction:column;min-width:65px}.navbtn span{font-size:18px}.navbtn.active{color:var(--red)}.view{scroll-margin-top:20px}.status{padding:9px 13px;border:1px solid var(--line);background:white;border-radius:12px;font-size:12px;color:var(--sub);margin:10px 0}a:focus-visible,button:focus-visible{outline:3px solid #1b7775;outline-offset:3px}@media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand"><div class="flag">✚</div><span>UKRAINIANS IN SWITZERLAND<br><span style="color:#bb3035">× VIDNOVA</span></span></div><div class="lang" aria-label="Мова інтерфейсу"><button class="active" data-lang="uk">УКР</button><button data-lang="en">EN</button></div></header>
  <main id="main"></main>
  <footer class="footer"><strong>VIDNOVA × Українці в Швейцарії</strong><div id="footerText">Інформаційно-сервісний навігатор. © 2026</div></footer>
</div>
<nav class="bottom" aria-label="Основна навігація"><div class="bottomInner" id="navigation"></div></nav>
<script>
/* ================================================================
   РЕДАГУЙТЕ ЛИШЕ ЦЕЙ БЛОК: адреси, послуги, нові рубрики, тексти.
   Посилання на консультацію поки веде до каналу, бо окремого
   перевіреного контакту для запису не надано.
   ================================================================ */
window.VIDNOVA_DATA={
 channel:'https://t.me/UkrainianSwitzerland',
 chat:'https://t.me/UkrainiansInSwitzerlandChat',
 vidnovaWebsite:'', // за наявності додайте офіційний сайт
 consultationUrl:'https://t.me/UkrainianSwitzerland', // замініть прямим посиланням для запису
 resources:[
  {icon:'🛡️',name:{uk:'Статус S',en:'Protection S'},desc:{uk:'Права, документи, правила',en:'Rights, documents, rules'},url:'https://t.me/UkrainianSwitzerland'},
  {icon:'💼',name:{uk:'Робота',en:'Employment'},desc:{uk:'Працевлаштування і кар’єра',en:'Jobs and careers'},url:'https://t.me/UkrainianSwitzerland'},
  {icon:'🎓',name:{uk:'Освіта',en:'Education'},desc:{uk:'Навчання та дипломи',en:'Studies and diplomas'},url:'https://t.me/UkrainianSwitzerland'},
  {icon:'📅',name:{uk:'Події',en:'Events'},desc:{uk:'Афіша та зустрічі',en:'What’s on'},url:'https://t.me/UkrainianSwitzerland'},
  {icon:'📰',name:{uk:'Новини',en:'News'},desc:{uk:'Оновлення зі Швейцарії',en:'Swiss updates'},url:'https://t.me/UkrainianSwitzerland'},
  {icon:'🤝',name:{uk:'VIDNOVA',en:'VIDNOVA'},desc:{uk:'Інтеграція та партнерства',en:'Integration and partnerships'},url:'#services'}
 ],
 contacts:[
  {title:{uk:'Telegram-канал',en:'Telegram channel'},subtitle:{uk:'Новини та корисні матеріали',en:'News and useful resources'},url:'https://t.me/UkrainianSwitzerland'},
  {title:{uk:'Спільнота українців',en:'Ukrainian community'},subtitle:{uk:'Обговорення та взаємодопомога',en:'Discussion and peer support'},url:'https://t.me/UkrainiansInSwitzerlandChat'}
 ]
};
const TR={uk:{eyebrow:'ВАШ ІНФОРМАЦІЙНИЙ ПРОСТІР',headline:'Швейцарія.<br><em>Зрозуміло.</em><br>Разом.',intro:'Корисна інформація для українців у Швейцарії, можливості для інтеграції та ініціативи VIDNOVA — в одному місці.',consult:'Потрібна індивідуальна підтримка?',consultdesc:'Знайдіть інформацію про консультації з інтеграції, освіти та працевлаштування. Для уточнення умов звертайтеся через канал.',consultbtn:'Дізнатися про консультацію ↗',note:'Запис та умови консультації уточнюються окремо.',sections:'Оберіть тему',sectionsnote:'Швидка навігація',services:'VIDNOVA: напрями роботи',svc1:'Консультації та інтеграція',svc1desc:'Орієнтація в питаннях проживання, адаптації, навчання та зайнятості у Швейцарії.',svc2:'Події та партнерства',svc2desc:'Громадські, освітні та міжкультурні ініціативи. Співпраця з українськими й швейцарськими партнерами.',follow:'Зв’язатися через канал',news:'Спільнота та оновлення',legal:'Зверніть увагу: застосунок — інформаційний навігатор, а не офіційна державна служба. Правила можуть змінюватися; юридично значущу інформацію звіряйте з офіційними органами Швейцарії.',home:'Головна',topics:'Теми',vidnova:'VIDNOVA',contacts:'Контакти'},en:{eyebrow:'YOUR INFORMATION HUB',headline:'Switzerland.<br><em>Made clearer.</em><br>Together.',intro:'Useful information for Ukrainians in Switzerland, integration opportunities and VIDNOVA initiatives in one place.',consult:'Need individual guidance?',consultdesc:'Explore consultations on integration, education and employment. Please ask via the channel for conditions and availability.',consultbtn:'Ask about a consultation ↗',note:'Consultation availability and conditions are confirmed separately.',sections:'Choose a topic',sectionsnote:'Quick navigation',services:'VIDNOVA: what we do',svc1:'Guidance and integration',svc1desc:'Information on living, integration, education and employment in Switzerland.',svc2:'Events and partnerships',svc2desc:'Civic, educational and intercultural initiatives with Ukrainian and Swiss partners.',follow:'Contact via channel',news:'Community and updates',legal:'Please note: this app is an information guide, not an official government service. Rules may change; verify legally significant information with Swiss authorities.',home:'Home',topics:'Topics',vidnova:'VIDNOVA',contacts:'Contacts'}};
let lang='uk';const DATA=window.VIDNOVA_DATA;const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor('#f7f5ef');tg?.setBackgroundColor('#f7f5ef')}catch(e){console.warn('Telegram appearance:',e)}
const safeUrl=u=>typeof u==='string'&&(/^(https:\/\/|#)/.test(u))?u:'#';
function openDestination(raw){const url=safeUrl(raw);if(url==='#')return;if(url.startsWith('#')){document.querySelector(url)?.scrollIntoView({behavior:'smooth'});return}if(tg?.initData){try{if(/^https:\/\/t\.me\//i.test(url))tg.openTelegramLink(url);else tg.openLink(url);return}catch(e){console.warn('Telegram link fallback',e)}}window.open(url,'_blank','noopener,noreferrer')}
function link(url,cls,content){return `<a href="${safeUrl(url)}" class="${cls}" data-url="${safeUrl(url)}">${content}</a>`}
function render(){const t=TR[lang];document.documentElement.lang=lang;document.title='Українці в Швейцарії × VIDNOVA';document.getElementById('main').innerHTML=`
<section id="home" class="view"><div class="hero"><div class="eyebrow">${t.eyebrow}</div><h1>${t.headline}</h1><p class="lede">${t.intro}</p>${link('#services','cta',t.consultbtn)}</div></section>
<section id="topics" class="view"><div class="sectionhead"><h2>${t.sections}</h2><span>${t.sectionsnote}</span></div><div class="grid">${DATA.resources.map(x=>link(x.url,'tile',`<span class="pict" aria-hidden="true">${x.icon}</span><strong>${x.name[lang]}</strong><small>${x.desc[lang]}</small><span class="arr">↗</span>`)).join('')}</div></section>
<section id="services" class="view"><div class="sectionhead"><h2>${t.services}</h2></div><div class="card"><h3>${t.svc1}</h3><p>${t.svc1desc}</p>${link(DATA.consultationUrl,'pill primary',t.follow+' ↗')}<div class="softnote">${t.note}</div></div><div class="card"><h3>${t.svc2}</h3><p>${t.svc2desc}</p>${link(DATA.channel,'pill',t.news+' ↗')}</div></section>
<section id="contacts" class="view"><div class="sectionhead"><h2>${t.news}</h2></div>${DATA.contacts.map(x=>link(x.url,'entry',`<div><strong>${x.title[lang]}</strong><small>${x.subtitle[lang]}</small></div><span>↗</span>`)).join('')}<div class="disclaimer">${t.legal}</div></section>`;
document.getElementById('navigation').innerHTML=[['home','⌂',t.home],['topics','▦',t.topics],['services','◇',t.vidnova],['contacts','✉',t.contacts]].map((x,i)=>`<button type="button" class="navbtn ${i===0?'active':''}" data-scroll="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');document.getElementById('footerText').textContent=lang==='uk'?'Інформаційно-сервісний навігатор. © 2026':'Information and services guide. © 2026';document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}
document.addEventListener('click',event=>{const a=event.target.closest('a[data-url]');if(a){event.preventDefault();openDestination(a.dataset.url);return}const b=event.target.closest('[data-lang]');if(b){lang=b.dataset.lang;render();return}const nav=event.target.closest('[data-scroll]');if(nav){document.getElementById(nav.dataset.scroll)?.scrollIntoView({behavior:'smooth'});document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x===nav))}});render();
</script>
</body>
</html>
